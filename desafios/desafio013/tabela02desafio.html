<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="imagem/Bokehlicia-Captiva-Logview.ico" type="image/x-icon">
    <title>Desafio13 tabela02</title>

    <style>

        *{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            border-collapse: separate;
            width: 300px;
            height: 200px;
            padding: 5px;
        }

        caption {
            background-color: rgba(94, 92, 92, 0.76);
            color: rgb(247, 245, 245);
            font-size: 1.2em;
        }

        td{
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    
    <table>

        <caption>
            Tabelas com mesclagem de células
        </caption>

        <tr>
            <td colspan="5">A</td>
            <td rowspan="4">B</td>
        </tr>

        <tr>
            <td rowspan="5">C</td>
            <td>D</td>
            <td>E</td>
            <td>F</td>
        </tr>

        <tr>
            <td>G</td>
            <td>H</td>
            <td>I</td>
        </tr>

        <tr>
            <td>J</td>
            <td>L</td>
            <td>M</td>
        </tr>

        <tr>
            <td colspan="5">N</td>
        </tr>
    </table>

</body>
</html>
