<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de Tabelas</title>

    <style>

        table {
            font-family: Arial, Helvetica, sans-serif;
            border-collapse: collapse;
            width: 400px;
        }

        caption{
           font-weight: bold;
           font-size: 1.5em; 
           padding: 10px;
        }

        th,td {
            border: 1px solid black;
            padding: 8px;
        }

        .destaque{
            background-color: yellowgreen;
        }

        .cnome {
            background-color: greenyellow;
        }

        .amarelo {
            background-color: yellow;
        }

        .vermelho {
            background-color: red;
        }

    </style>
</head>
<body>

    <h1>Exercício de Tabela</h1>  <!--agrupando tabelas com colgroup-->
    <table>

        <colgroup>
           <col class="vermelho"> 
           <col class="amarelo" span="2"> 
           <col class="vermelho">
         
        </colgroup>

        <caption>Cadastro</caption>

        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>

        <tr>
            <td>Ana Maria</td>
            <td>F</td>
            <td>25</td>
            <td>Jornalista</td>
        </tr>

        <tr>
            <td>Cláudio</td>
            <td>M</td>
            <td>42</td>
            <td>Pedreiro</td>
        </tr>

        <tr>
            <td class="destaque">Gustavo</td>
            <td>M</td>
            <td>29</td>
            <td>Professor</td>
        </tr>

        <tr>
            <td class="destaque">Maria</td>
            <td>F</td>
            <td>52</td>
            <td>Médica</td>
        </tr>

        <tr>
            <td>Otávio</td>
            <td>M</td>
            <td>35</td>
            <td>Nutriconista</td>
        </tr>

    </table>
</body>
</html>
