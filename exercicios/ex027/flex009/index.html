<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>

    <style> 
        .conteiner {
            background-color: rgb(189, 38, 38);
            display: flex;
            flex-flow: row nowrap;
        }

        .item{
            background-color: rgb(89, 89, 150);
            border: 1px solid black;
            text-align: center;
        }

        #cxA {
            flex-basis: 150px;
            flex-grow: 1;
            flex-shrink: 1;
        }

        #cxB {
            flex-basis: 150px;
            flex-grow: 1;
            flex-shrink: 1;
        }

        #cxC {
            flex-basis: 150px;
            flex-grow: 2;
            flex-shrink: 1;
        }
        
    </style>
</head>
<body>
        <div class="conteiner">
            <div class="item" id="cxA">A</div>
            <div class="item" id="cxB">B</div>
            <div class="item" id="cxC">C</div>
        </div>
</body>
</html>
